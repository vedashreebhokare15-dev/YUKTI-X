<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Illustrative NDMI moisture index raster">
  <defs>
    <linearGradient id="ndmiBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3b33"/>
      <stop offset="50%" stop-color="#136a4f"/>
      <stop offset="100%" stop-color="#2a8a5e"/>
    </linearGradient>
    <filter id="ndmiSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="ndmiGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" seed="21"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
    </filter>
    <filter id="ndmiEdge">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="ndmiClip"><rect width="640" height="420" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#ndmiClip)">
    <rect width="640" height="420" fill="url(#ndmiBase)"/>
    <g filter="url(#ndmiSoft)" opacity="0.95">
      <ellipse cx="150" cy="120" rx="180" ry="120" fill="#1c8663"/>
      <ellipse cx="420" cy="210" rx="200" ry="150" fill="#2b9664"/>
      <ellipse cx="560" cy="90" rx="130" ry="90" fill="#146651"/>
      <ellipse cx="180" cy="330" rx="160" ry="100" fill="#2a7f63"/>
      <ellipse cx="540" cy="340" rx="140" ry="100" fill="#3d8f57"/>
      <ellipse cx="360" cy="70" rx="110" ry="70" fill="#59a358"/>
    </g>
    <g filter="url(#ndmiEdge)" opacity="0.9">
      <path d="M250 300c70-40 150-16 182 24 28 36-4 78-64 88-70 11-120-14-140-48-13-24-2-48 22-64z" fill="#9da33f"/>
      <path d="M318 318c44-21 90-4 100 24 10 28-22 48-64 50-44 2-74-18-72-42 1-14 18-23 36-32z" fill="#d2b84e"/>
      <path d="M372 336c20-10 42 0 43 15 1 14-18 24-39 22-20-1-30-14-24-24 3-6 11-9 20-13z" fill="#c15a3a"/>
    </g>
    <g filter="url(#ndmiSoft)" opacity="0.85">
      <ellipse cx="470" cy="160" rx="88" ry="62" fill="#76a94c"/>
      <ellipse cx="90" cy="230" rx="70" ry="48" fill="#7da344"/>
      <ellipse cx="300" cy="180" rx="48" ry="30" fill="#8bb24e"/>
    </g>
    <path d="M-10 240c70 26 130 8 178-22 44-28 92-22 128 4 42 30 82 28 124 4 50-28 92-22 148 12 28 18 56 24 82 18" fill="none" stroke="#083c3a" stroke-width="12" opacity="0.72"/>
    <path d="M-10 240c70 26 130 8 178-22 44-28 92-22 128 4 42 30 82 28 124 4 50-28 92-22 148 12 28 18 56 24 82 18" fill="none" stroke="#3b8d83" stroke-width="5" opacity="0.55"/>
    <path d="M560 0c-20 70-12 118 8 160 22 48 10 94-10 132-14 28-20 68-16 128" fill="none" stroke="#9fc18a" stroke-width="3.5" opacity="0.3" stroke-dasharray="7 9"/>
    <rect width="640" height="420" filter="url(#ndmiGrain)" opacity="0.45" style="mix-blend-mode:overlay"/>
    <rect width="640" height="420" fill="#03281c" opacity="0.12"/>
  </g>
</svg>
