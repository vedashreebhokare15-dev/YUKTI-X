<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Illustrative NBR burn and disturbance index raster">
  <defs>
    <linearGradient id="nbrBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123a2b"/>
      <stop offset="52%" stop-color="#2d6a35"/>
      <stop offset="100%" stop-color="#507a30"/>
    </linearGradient>
    <filter id="nbrSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="nbrGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" seed="33"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>
    </filter>
    <filter id="nbrEdge">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="nbrClip"><rect width="640" height="420" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#nbrClip)">
    <rect width="640" height="420" fill="url(#nbrBase)"/>
    <g filter="url(#nbrSoft)" opacity="0.95">
      <ellipse cx="140" cy="110" rx="160" ry="110" fill="#357a37"/>
      <ellipse cx="360" cy="270" rx="200" ry="150" fill="#437f38"/>
      <ellipse cx="550" cy="120" rx="160" ry="110" fill="#2b6331"/>
      <ellipse cx="110" cy="340" rx="150" ry="90" fill="#3b7034"/>
      <ellipse cx="520" cy="330" rx="150" ry="100" fill="#6f8535"/>
      <ellipse cx="340" cy="80" rx="100" ry="65" fill="#879a3c"/>
    </g>
    <g filter="url(#nbrEdge)" opacity="0.92">
      <path d="M60 250c56-46 140-40 178-4 32 30 22 80-26 104-64 32-138 12-166-28-18-26-10-52 14-72z" fill="#b0a03f"/>
      <path d="M120 282c40-24 90-12 102 18 10 26-18 50-58 52-42 2-70-18-66-42 2-12 10-20 22-28z" fill="#d08a3c"/>
      <path d="M168 300c20-9 42 2 42 18 0 15-22 24-42 21-19-2-28-16-21-27 4-7 12-9 21-12z" fill="#a83d31"/>
      <path d="M420 80c54-30 118-16 138 16 18 28-8 66-54 76-60 14-116-12-124-48-5-22 14-32 40-44z" fill="#9c8c3a"/>
      <path d="M458 100c28-14 62-4 70 14 7 17-9 36-36 40-32 5-58-8-62-26-3-13 10-21 28-28z" fill="#bc6f35"/>
    </g>
    <g filter="url(#nbrSoft)" opacity="0.8">
      <ellipse cx="300" cy="170" rx="90" ry="55" fill="#7d9440"/>
      <ellipse cx="180" cy="180" rx="46" ry="30" fill="#64883a"/>
      <ellipse cx="470" cy="260" rx="60" ry="40" fill="#86983f"/>
    </g>
    <path d="M-10 355c82-22 120-4 170 10 56 16 84 2 120-18 40-22 84-18 128 6 42 22 84 20 128-2 34-16 66-18 114 0" fill="none" stroke="#163f38" stroke-width="10" opacity="0.65"/>
    <path d="M-10 355c82-22 120-4 170 10 56 16 84 2 120-18 40-22 84-18 128 6 42 22 84 20 128-2 34-16 66-18 114 0" fill="none" stroke="#4a7f6d" stroke-width="5" opacity="0.45"/>
    <path d="M430 0c10 52-16 92-6 136 12 52 40 66 34 112-4 34 8 66 26 92" fill="none" stroke="#e0d18d" stroke-width="3.5" opacity="0.3" stroke-dasharray="7 9"/>
    <rect width="640" height="420" filter="url(#nbrGrain)" opacity="0.45" style="mix-blend-mode:overlay"/>
    <rect width="640" height="420" fill="#03281c" opacity="0.12"/>
  </g>
</svg>
