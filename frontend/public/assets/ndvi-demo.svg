<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Illustrative NDVI vegetation index raster">
  <defs>
    <linearGradient id="ndviBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3c2a"/>
      <stop offset="55%" stop-color="#1c6038"/>
      <stop offset="100%" stop-color="#2c7a3f"/>
    </linearGradient>
    <filter id="ndviSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="ndviGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>
    </filter>
    <filter id="ndviEdge">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="ndviClip"><rect width="640" height="420" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#ndviClip)">
    <rect width="640" height="420" fill="url(#ndviBase)"/>
    <g filter="url(#ndviSoft)" opacity="0.95">
      <ellipse cx="130" cy="100" rx="150" ry="100" fill="#2f7f3c"/>
      <ellipse cx="330" cy="250" rx="190" ry="140" fill="#3f9142"/>
      <ellipse cx="540" cy="110" rx="160" ry="100" fill="#1d5c33"/>
      <ellipse cx="120" cy="340" rx="170" ry="90" fill="#265f33"/>
      <ellipse cx="500" cy="330" rx="130" ry="95" fill="#6a9b3b"/>
      <ellipse cx="420" cy="80" rx="90" ry="60" fill="#8dab3f"/>
    </g>
    <g filter="url(#ndviEdge)" opacity="0.85">
      <path d="M430 250c60-34 120-18 150 6 30 24 8 74-40 88-58 17-96-8-124-32-19-16-8-48 14-62z" fill="#c8c447"/>
      <path d="M470 275c34-18 72-6 84 14 10 20-4 42-32 49-32 8-60-8-72-22-10-13 2-32 20-41z" fill="#e0b347"/>
      <path d="M498 296c17-9 37-2 40 11 3 14-13 24-30 23-17-1-27-11-26-20 1-6 9-10 16-14z" fill="#c9553d"/>
    </g>
    <g filter="url(#ndviSoft)" opacity="0.8">
      <ellipse cx="245" cy="120" rx="70" ry="45" fill="#9fae3e"/>
      <ellipse cx="180" cy="210" rx="45" ry="30" fill="#8aa23d"/>
      <ellipse cx="590" cy="210" rx="55" ry="42" fill="#7c9c3a"/>
    </g>
    <path d="M-10 315c80-30 120-16 180 6 50 18 76 8 120-14 44-22 90-12 126 8 48 28 92 20 144-4 34-16 66-18 96-6" fill="none" stroke="#123f3a" stroke-width="11" opacity="0.7"/>
    <path d="M-10 315c80-30 120-16 180 6 50 18 76 8 120-14 44-22 90-12 126 8 48 28 92 20 144-4 34-16 66-18 96-6" fill="none" stroke="#2f7f74" stroke-width="5" opacity="0.5"/>
    <path d="M96 0c20 70 6 120 34 168 26 44 16 92 6 140-8 38-2 76 12 112" fill="none" stroke="#d8d586" stroke-width="4" opacity="0.28" stroke-dasharray="8 10"/>
    <rect width="640" height="420" filter="url(#ndviGrain)" opacity="0.5" style="mix-blend-mode:overlay"/>
    <rect width="640" height="420" fill="#03281c" opacity="0.12"/>
  </g>
</svg>
